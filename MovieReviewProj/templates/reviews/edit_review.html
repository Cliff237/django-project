{% extends 'movies/base.html' %}
{% load static %}

{% block title %}Edit Review - {{ review.movie.title }} | CineRate{% endblock %}

{% block content %}
    <a href="{% url 'movies:movie_detail' review.movie.slug %}" class="back-link">
        <i class="fas fa-arrow-left"></i> Back to Movie
    </a>

    <div class="review-form-container">
        <h1>Edit Your Review for <span>{{ review.movie.title }}</span></h1>

        <form method="POST" class="review-form">
            {% csrf_token %}

            <div class="form-group">
                <label for="reviewer_name">Your Name</label>
                <input type="text" name="reviewer_name" id="reviewer_name" 
                       value="{{ review.reviewer_name }}" class="form-input">
            </div>

            <!-- Star Rating (pre-selected) -->
            <div class="form-group">
                <label>Your Rating</label>
                <div class="star-rating">
                    {% for i in "12345"|make_list %}
                        <input type="radio" id="star{{ i }}" name="rating" value="{{ i }}"
                               {% if review.rating == i|add:0 %}checked{% endif %}>
                        <label for="star{{ i }}" title="{{ i }} stars">★</label>
                    {% endfor %}
                </div>
            </div>

            <div class="form-group">
                <label for="comment">Your Review</label>
                <textarea name="comment" id="comment" rows="8" class="form-textarea">{{ review.comment }}</textarea>
            </div>

            <button type="submit" class="submit-btn">
                <i class="fas fa-save"></i> Update Review
            </button>
        </form>
    </div>
{% endblock %}
