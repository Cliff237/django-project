{% extends "base.html" %}
{% load static %}
{% block title %}Password Changed - Movie Review{% endblock %}
{% block extrahead %}
    <link rel="stylesheet" href="{% static 'fotawesome/css/all.min.css' %}">
{% endblock %}

{% block content %}
    <section class="section">
        <div class="wrap">
            <div class="window window--stacked">
                <div class="window-titlebar">Password Changed</div>
                <div class="window-body">
                    <p>Your password has been changed successfully.</p>
                    <a href="{% url 'accounts' %}" class="btn btn--primary">Return to Account</a>
                </div>
            </div>
        </div>
    </section>
{% endblock %}
