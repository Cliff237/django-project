{% extends "base.html" %}
{% load static %}
{% block title %}Change Password - Movie Review{% endblock %}
{% block extrahead %}
    <link rel="stylesheet" href="{% static 'fotawesome/css/all.min.css' %}">
{% endblock %}

{% block content %}
    <section class="section">
        <div class="wrap">
            <div class="window window--stacked">
                <div class="window-titlebar">Change Password</div>
                <div class="window-body">
                    {% if form.errors %}
                        <p class="error-message">Please correct the error below.</p>
                    {% endif %}
                    <form method="post">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button type="submit" class="btn btn--primary">Change Password</button>
                    </form>
                </div>
            </div>
        </div>
    </section>
{% endblock %}
