{% extends "base.html" %}
{% load static %}
{% block title %}Password Reset Complete - Movie Review{% endblock %}
{% block extrahead %}
    <link rel="stylesheet" href="{% static 'fotawesome/css/all.min.css' %}">
{% endblock %}

{% block content %}
    <section class="section">
        <div class="wrap">
            <div class="window window--stacked">
                <div class="window-titlebar">Password Reset Complete</div>
                <div class="window-body">
                    <p>Your password has been set. You may go ahead and log in now.</p>
                    <a href="{% url 'login' %}" class="btn btn--primary">Log in</a>
                </div>
            </div>
        </div>
    </section>
{% endblock %}
